[project]
name = "sentinel"
version = "0.1.0"
description = "Real-time log anomaly detector with alert feed over a simulated Medicaid claims platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
sentinel-generator = "sim.generator:main"
sentinel-control-api = "sim.control_api:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sim", "detector", "delivery", "api", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:sim.*", "error::DeprecationWarning:detector.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL", "TRY", "EM"]
ignore = [
    "PLR0913",  # the tick functions legitimately take many knobs
    "TRY003",   # long messages in raise are fine in a small codebase
    "EM101",    # exception messages inline read better than sentinel constants
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
